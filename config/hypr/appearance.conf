general { gaps_in = 5; gaps_out = 10; border_size = 2; layout = dwindle; allow_tearing = false }
decoration { rounding = 8; active_opacity = 1.0; inactive_opacity = 0.94; shadow { enabled = true; range = 10; render_power = 3 } }
input { kb_layout = us; follow_mouse = 1; touchpad { natural_scroll = true; tap-to-click = true } }
dwindle { pseudotile = true; preserve_split = true }
misc { disable_hyprland_logo = true; force_default_wallpaper = 0 }
